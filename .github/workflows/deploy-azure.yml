name: Deploy to Azure Container Apps

# Push to main -> test -> build the image in ACR -> roll the container app.
# No Azure credentials are stored in GitHub: azure/login exchanges the
# workflow's short-lived OIDC token for an Azure token. The three secrets
# below are identifiers, not passwords.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-azure
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for the OIDC token exchange

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in Azure Container Registry
        run: |
          az acr build \
            --registry "${{ vars.AZURE_ACR_NAME }}" \
            --image "ai-builder-mvp:${{ github.sha }}" \
            --image "ai-builder-mvp:latest" \
            .

      - name: Roll the container app to the new image
        run: |
          az containerapp update \
            --name "${{ vars.AZURE_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ vars.AZURE_ACR_NAME }}.azurecr.io/ai-builder-mvp:${{ github.sha }}"

      - name: Report the URL
        run: |
          fqdn=$(az containerapp show \
            --name "${{ vars.AZURE_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "Deployed: https://$fqdn" >> "$GITHUB_STEP_SUMMARY"
